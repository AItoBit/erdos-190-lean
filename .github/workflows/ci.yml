name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
      - name: Check axioms
        run: |
          lake env lean Check.lean | tee axioms.txt
          if grep -q sorryAx axioms.txt; then echo "sorryAx found"; exit 1; fi
